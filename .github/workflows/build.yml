name: Build Horizon APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK from HorizonLauncher.zip
        run: |
          unzip -q -o HorizonLauncher.zip -d src
          cd src/HorizonLauncher
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HorizonLauncher.apk"

      - name: Save APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: HorizonLauncher
          path: HorizonLauncher.apk

      - name: Publish APK (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon Launcher build ${{ github.run_number }}
          files: HorizonLauncher.apk
